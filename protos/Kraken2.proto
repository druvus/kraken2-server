syntax = "proto3";

package kraken2proto;

// Interface exported by the server.
service Kraken2Service {
  rpc ServerReady(Kraken2ReadyRequest) returns (Kraken2ReadyResult) {}
  rpc GetSummary(Kraken2SummaryRequest) returns (Kraken2SummaryResults) {}
  rpc RemoteShutdown(Kraken2ShutdownRequest) returns (Kraken2ShutdownResult) {}
  rpc ClassifyStream(stream Kraken2SequenceRequestMulti) returns (stream Kraken2SequenceStreamResult) {}
}

// Request if server is ready (index loaded)
message Kraken2ReadyRequest {}

message Kraken2ReadyResult {
  bool ready = 1;
}

// Request historical classification summary
message Kraken2SummaryRequest {}

message Kraken2SummaryResults {
  string summary = 1;
}

// Remote shutdown request
message Kraken2ShutdownRequest {}

message Kraken2ShutdownResult {
  bool successful = 1;
}

// Classify sequences
message Kraken2SequenceRequest {
  enum SequenceFormat {
    FORMAT_AUTO_DETECT = 0;
    FORMAT_FASTA = 1;
    FORMAT_FASTQ = 2;
  }
  SequenceFormat format = 1;
  // Full header line. Not used by the server and no longer sent.
  string header = 2 [deprecated = true];
  // Read name up to the first whitespace.
  string id = 3;
  string seq = 4;
  // Quality string, FASTQ only. Must match seq in length.
  string quals = 5;
  // Text rendering of the record. Not used by the server and no longer sent.
  string str_representation = 6 [deprecated = true];
  // Second read of a pair. Absent for single-end reads. When present the
  // server classifies both reads as one fragment.
  Kraken2SequenceRequest mate = 7;
}

message Kraken2SequenceRequestMulti {
  repeated Kraken2SequenceRequest seqs = 1;
}

// - Classification result
message Kraken2SequenceResult {
  string id = 1;
  bool classified = 2;
  // External (NCBI) taxonomy id of the call, 0 when unclassified.
  uint64 tax_id = 3;
  // Scientific name of the call. Not sent since v0.2.0; the report carries names.
  string name = 4 [deprecated = true];
  // Sequence length (of the first mate for pairs).
  uint32 size = 5;
  // Minimizer hit list in kraken2 format, e.g. "562:13 0:4 |:| 562:9".
  string hitlist = 6;
  // True when the result covers a read pair; size2 is then the mate length.
  bool paired = 7;
  uint32 size2 = 8;
}

message Kraken2SequenceResultMulti {
  repeated Kraken2SequenceResult classes = 1;
}

// - a stream of results
message Kraken2SequenceStreamResult {
  oneof result {
    string summary = 1;
    Kraken2SequenceResultMulti classifications = 2;
  }
}
