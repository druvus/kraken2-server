include:
    - project: "epi2melabs/ci-templates"
      file: "push-github.yaml"
    - project: "epi2melabs/ci-templates"
      file: "push-conda.yaml"
    - project: "epi2melabs/ci-templates"
      file: "snippets.yaml"

image: ${UBUNTUIMAGE}:20.04

variables:
    GIT_SUBMODULE_STRATEGY: recursive


stages:
    - prerelease
    - release


deploy-checks:
    stage: prerelease
    variables:
        PACKAGE_NAME: kraken2-server
    script:
        # TODO: store a version in code somewhere and check
        - !reference [.check, changelog]
        - !reference [.check, license]
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'


# gRPC and protobuf are taken from the conda-forge libgrpc and libprotobuf
# packages (see conda/meta.yaml), so no separate dependency build is needed.
.conda:
    variables:
        RECIPEPATH: "../conda"
    before_script:
        - export CONDA_PKG=${CI_PROJECT_NAME}
        - VERSION="0.0.0"
        - if [[ -n "${CI_COMMIT_TAG}" ]]; then VERSION=${CI_COMMIT_TAG/v}; fi
        - export CONDA_PKG_VERSION="${VERSION}"
        - mkdir conda-build
        - cd conda-build
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'
        - if: '$CI_COMMIT_BRANCH =~ /package-build/'


conda-linux-x86:
    extends:
        - .deploy-conda-linux
        - .conda
    variables:
        MINICONDAOS: Linux
        ARCH: x86_64

conda-linux-arm64:
    extends:
        - .deploy-conda-linux-arm
        - .conda
    variables:
        MINICONDAOS: Linux
        ARCH: aarch64
    tags:
        - arm64

conda-mac-arm:
    extends:
        - .deploy-conda-mac-arm
        - .conda
