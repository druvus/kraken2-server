include:
    - project: "epi2melabs/ci-templates"
      file: "push-github.yaml"
    - project: "epi2melabs/ci-templates"
      file: "push-conda.yaml"
    - project: "epi2melabs/ci-templates"
      file: "snippets.yaml"

image: ${UBUNTUIMAGE}:20.04

variables:
    GIT_SUBMODULE_STRATEGY: recursive


stages:
    - build
    - test
    - prerelease
    - release


# Compile and smoke test on every push, using the same conda-forge packages
# as the conda recipe. Packaging jobs below run only on tags.
build-test:
    stage: build
    script:
        - apt-get update -qq && apt-get install -y -qq wget > /dev/null
        - wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
        - bash miniforge.sh -b -p /tmp/miniforge
        - source /tmp/miniforge/bin/activate
        - mamba create -y -q -n build -c conda-forge cmake libgrpc libprotobuf zlib cxx-compiler make doctest
        - conda activate build
        - mkdir build && cd build
        - cmake -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST_TOOLS=ON -DBUILD_TESTS=ON -DENABLE_WERROR=ON ..
        - make -j 4
        - ./tests/unit_tests
        - ./server/kraken2_server --help
        - ./client/kraken2_client --help
    artifacts:
        paths:
            - build/server/kraken2_server
            - build/client/kraken2_client
            - build/testing/raw_client
        expire_in: 1 week


# Compare server and client output with the kraken2 program on the small
# test database. The database and reads (about 300 MB) are cached between
# runs. The binaries come from the build-test artifacts.
parity-test:
    stage: test
    needs:
        - build-test
    script:
        - apt-get update -qq && apt-get install -y -qq wget curl > /dev/null
        - wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
        - bash miniforge.sh -b -p /tmp/miniforge
        - source /tmp/miniforge/bin/activate
        - mamba create -y -q -n parity -c conda-forge -c bioconda libgrpc libprotobuf zlib kraken2 seqkit
        - conda activate parity
        - export SERVER=$PWD/build/server/kraken2_server
        - export CLIENT=$PWD/build/client/kraken2_client
        - export RAW_CLIENT=$PWD/build/testing/raw_client
        - ./testing/parity_test.sh 8123
    cache:
        key: parity-test-data
        paths:
            - testing/virus-zymo-kraken2
            - testing/virus-zymo-kraken.reads.fastq.gz


deploy-checks:
    stage: prerelease
    variables:
        PACKAGE_NAME: kraken2-server
    script:
        # TODO: store a version in code somewhere and check
        - !reference [.check, changelog]
        - !reference [.check, license]
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'


# gRPC and protobuf are taken from the conda-forge libgrpc and libprotobuf
# packages (see conda/meta.yaml), so no separate dependency build is needed.
.conda:
    variables:
        RECIPEPATH: "../conda"
    before_script:
        - export CONDA_PKG=${CI_PROJECT_NAME}
        - VERSION="0.0.0"
        - if [[ -n "${CI_COMMIT_TAG}" ]]; then VERSION=${CI_COMMIT_TAG/v}; fi
        - export CONDA_PKG_VERSION="${VERSION}"
        - mkdir conda-build
        - cd conda-build
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'
        - if: '$CI_COMMIT_BRANCH =~ /package-build/'


conda-linux-x86:
    extends:
        - .deploy-conda-linux
        - .conda
    variables:
        MINICONDAOS: Linux
        ARCH: x86_64

conda-linux-arm64:
    extends:
        - .deploy-conda-linux-arm
        - .conda
    variables:
        MINICONDAOS: Linux
        ARCH: aarch64
    tags:
        - arm64

conda-mac-arm:
    extends:
        - .deploy-conda-mac-arm
        - .conda
