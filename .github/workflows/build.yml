name: Build and test

# One Linux job: build with warnings as errors, unit tests, the kraken2
# parity suite and the Python client tests. Pull requests and pushes to
# master; a newer push to the same branch cancels the run still going.
# macOS is covered by the conda packaging on GitLab.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: build
          # libsystemd: current conda-forge libgrpc builds link against it
          # without depending on it
          create-args: >-
            cmake
            make
            cxx-compiler
            libgrpc
            libprotobuf
            libsystemd
            zlib
            doctest
            kraken2
            seqkit
            openssl
            python=3.12
            grpcio
            grpcio-tools
            protobuf
            pytest
            pip
          init-shell: bash
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=ON -DBUILD_TEST_TOOLS=ON -DENABLE_WERROR=ON
          make -C build -j 4

      - name: Unit tests
        run: ./build/tests/unit_tests

      - uses: actions/cache@v4
        with:
          path: |
            testing/virus-zymo-kraken2
            testing/virus-zymo-kraken.reads.fastq.gz
          key: virus-zymo-test-data-v1

      - name: Parity test against kraken2
        run: ./testing/parity_test.sh 8123

      - name: Python client
        run: |
          # no build isolation so the stubs are generated with the
          # environment's grpcio-tools, matching its grpcio
          pip install --no-build-isolation ./python
          pytest -q python/tests
